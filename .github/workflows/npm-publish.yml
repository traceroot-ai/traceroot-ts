name: Publish to npm

on:
  release:
    types: [published]

jobs:
  # Triggered by tags like: v0.1.1, v1.0.0
  publish-traceroot:
    if: "!startsWith(github.event.release.tag_name, 'mastra-')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation via OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing authenticates over OIDC and needs npm >= 11.5.1.
      # Node 22 ships npm 10, so upgrade before publishing. Pinned to the 11
      # line: npm 12 requires Node ^22.22.2 and `@latest` broke the
      # traceroot-cli v0.3.0 publish the day npm 12 shipped.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast — verify tag matches package.json before running build/tests
      - name: Verify release tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/traceroot/package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag $TAG"

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm --filter @traceroot-ai/traceroot test

      # No token: npm verifies the OIDC claim that this run came from this repo
      # and workflow. Published with npm rather than pnpm because pnpm's publish
      # does not perform the OIDC exchange; safe because this package has no
      # workspace: dependencies to rewrite.
      - name: Publish @traceroot-ai/traceroot
        run: npm publish --provenance --access public
        working-directory: packages/traceroot

  # Triggered by tags like: mastra-v0.1.0, mastra-v1.0.0
  publish-mastra:
    if: startsWith(github.event.release.tag_name, 'mastra-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation via OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Trusted publishing authenticates over OIDC and needs npm >= 11.5.1.
      # Node 22 ships npm 10, so upgrade before publishing. Pinned to the 11
      # line: npm 12 requires Node ^22.22.2 and `@latest` broke the
      # traceroot-cli v0.3.0 publish the day npm 12 shipped.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail fast — verify tag matches package.json before running build/tests
      - name: Verify release tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./packages/mastra/package.json').version")
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG#mastra-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ packages/mastra/package.json version ($PKG_VERSION) does not match release tag ($TAG)"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag $TAG"

      - name: Lint
        run: pnpm --filter @traceroot-ai/mastra lint

      - name: Build
        run: pnpm --filter @traceroot-ai/mastra build

      - name: Publish @traceroot-ai/mastra
        run: npm publish --provenance --access public
        working-directory: packages/mastra
